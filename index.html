<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bilu 6 · Walkthrough test</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#dedfd7;color:#242720;font:16px system-ui}canvas{width:100%;height:100%;display:block;touch-action:none}#view{position:fixed;inset:0}.bar{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}.bar>*{pointer-events:auto}button,select{font:inherit;min-height:44px;border:1px solid #a6ac9e;background:#f8f7f0eF;color:#273125;border-radius:12px;padding:9px 13px}button:active{background:#d8dfcc}#status{position:fixed;top:112px;left:12px;max-width:calc(100% - 24px);background:#f8f7f0e8;border-radius:9px;padding:8px 12px;font-size:14px;pointer-events:none}#stick{position:fixed;bottom:max(13px,env(safe-area-inset-bottom));left:9px;width:148px;height:148px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;z-index:2}#stick::before{content:"";position:absolute;inset:13px;border:1px solid #89957a;border-radius:50%;background:#eff2e485;pointer-events:none}#stick.active::before{border:2px solid #526447;background:#eff2e4b0}#knob{position:absolute;left:52px;top:52px;width:44px;height:44px;border-radius:50%;background:#526447ad;pointer-events:none}#hint{pointer-events:none;position:fixed;bottom:24px;right:18px;width:160px;text-align:right;color:#263024;background:#f8f7f0cf;padding:9px;border-radius:10px;font-size:14px}details{position:fixed;right:12px;top:112px;background:#f9f8f1ec;border-radius:10px;padding:10px;max-width:min(410px,94vw);max-height:50vh;overflow:auto}summary{min-height:24px;cursor:pointer}pre{white-space:pre-wrap;font:12px/1.5 monospace}#testbuttons{display:flex;gap:5px;flex-wrap:wrap}body.mobilePreview #view{right:auto;width:390px}body.mobilePreview .bar{right:auto;width:366px}body.mobilePreview #hint{left:216px;right:auto}body.mobilePreview details{left:12px;right:auto;top:160px;max-width:366px}body.mobilePreview #status{width:366px;top:112px}@media(max-width:600px){.bar{gap:5px}button,select{font-size:14px;padding:9px}#status{top:112px}details{top:160px;max-width:90vw}}
